version: '3.8'

services:
  megadetector:
    build: .
    container_name: megadetector
    ports:
      - "8501:8501"
    volumes:
      - megadetector-models:/root/.cache/megadetector
    environment:
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

volumes:
  megadetector-models:
